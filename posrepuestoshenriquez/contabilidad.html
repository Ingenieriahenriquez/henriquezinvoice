<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contabilidad — Ingeniería & Tecnología Henríquez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="contabilidad.css">
</head>
<body class="con-body">

  <header class="con-header">
    <a href="menu.html" class="btn-volver">← Volver al Menú</a>
    <h2>📊 Contabilidad Básica</h2>
  </header>

  <div class="con-wrap">

    <!-- Balance del período -->
    <div class="con-card con-balance-card">
      <div class="con-balance-filtros">
        <div>
          <label>Desde</label>
          <input type="date" id="fechaDesde">
        </div>
        <div>
          <label>Hasta</label>
          <input type="date" id="fechaHasta">
        </div>
        <button type="button" id="btnActualizarBalance" class="btn-actualizar">🔄 Actualizar</button>
      </div>

      <div class="con-balance-cifras">
        <div class="con-cifra con-cifra-ingreso">
          <span class="con-cifra-label">Ingresos</span>
          <span class="con-cifra-monto" id="cifraIngresos">$0.00</span>
        </div>
        <div class="con-cifra con-cifra-egreso">
          <span class="con-cifra-label">Egresos</span>
          <span class="con-cifra-monto" id="cifraEgresos">$0.00</span>
        </div>
        <div class="con-cifra con-cifra-utilidad">
          <span class="con-cifra-label">Utilidad</span>
          <span class="con-cifra-monto" id="cifraUtilidad">$0.00</span>
        </div>
      </div>
    </div>

    <div class="con-columnas">

      <!-- Formulario de gasto -->
      <div class="con-card">
        <h3>➕ Registrar Gasto</h3>
        <form id="formGasto">
          <label>Fecha</label>
          <input type="date" id="gastoFecha" required>

          <label>Descripción</label>
          <input type="text" id="gastoDescripcion" placeholder="Ej: Pago de agua" required>

          <label>Monto</label>
          <input type="number" step="0.01" id="gastoMonto" placeholder="0.00" required>

          <label>Categoría</label>
          <select id="gastoCategoria">
            <option>Transporte</option>
            <option>Alimentación</option>
            <option>Servicios</option>
            <option>Sueldos</option>
            <option>Útiles</option>
            <option selected>Varios</option>
          </select>

          <label>Responsable</label>
          <input type="text" id="gastoResponsable" placeholder="Opcional">

          <button type="submit">Guardar Gasto</button>
          <p id="mensajeGasto"></p>
        </form>
      </div>

      <!-- Lista de gastos -->
      <div class="con-card">
        <h3>Gastos Registrados</h3>
        <input type="text" id="buscadorGasto" placeholder="🔍 Buscar por descripción o categoría...">
        <table id="tablaGastos">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Descripción</th>
              <th>Categoría</th>
              <th>Responsable</th>
              <th>Monto</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cuerpoGastos"></tbody>
        </table>
      </div>

    </div>

    <!-- Libro diario simplificado -->
    <div class="con-card">
      <h3>📖 Libro Diario Simplificado (del período seleccionado)</h3>
      <table id="tablaLibroDiario">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Descripción</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="cuerpoLibroDiario"></tbody>
      </table>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="permisos.js"></script>
  <script src="contabilidad.js"></script>
</body>
</html>
