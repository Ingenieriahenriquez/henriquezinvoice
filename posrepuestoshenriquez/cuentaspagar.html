<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuentas por Pagar — Ingeniería & Tecnología Henríquez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="cuentaspagar.css">
</head>
<body class="cp-body">

  <header class="cp-header">
    <a href="menu.html" class="btn-volver">← Volver al Menú</a>
    <h2>📄 Cuentas por Pagar</h2>
  </header>

  <div class="cp-wrap">

    <!-- Resumen -->
    <div class="cp-card cp-resumen-card">
      <div class="cp-resumen-item">
        <span class="cp-resumen-label">Total Pendiente</span>
        <span class="cp-resumen-monto cp-monto-rojo" id="totalPendiente">$0.00</span>
      </div>
      <div class="cp-resumen-item">
        <span class="cp-resumen-label">Vencidas</span>
        <span class="cp-resumen-monto cp-monto-rojo" id="totalVencidas">$0.00</span>
      </div>
      <div class="cp-resumen-item">
        <span class="cp-resumen-label">Proveedores con deuda</span>
        <span class="cp-resumen-monto" id="totalProveedores">0</span>
      </div>
    </div>

    <div class="cp-columnas">

      <div class="cp-col-izq">
        <!-- Registrar proveedor -->
        <div class="cp-card">
          <h3>🤝 Registrar Proveedor</h3>
          <input type="text" id="provNombre" placeholder="Nombre del proveedor *">
          <input type="text" id="provTelefono" placeholder="Teléfono (opcional)">
          <input type="text" id="provRnc" placeholder="RNC (opcional)">
          <input type="text" id="provDireccion" placeholder="Dirección (opcional)">
          <button type="button" id="btnGuardarProveedor">Guardar Proveedor</button>
          <p id="mensajeProveedor"></p>
        </div>

        <!-- Registrar deuda -->
        <div class="cp-card">
          <h3>➕ Registrar Cuenta por Pagar</h3>
          <label>Proveedor</label>
          <div class="campo-buscador-wrap">
            <input type="text" id="cpProveedor" placeholder="🔍 Buscar proveedor...">
            <div id="resultadosProveedor"></div>
          </div>
          <label>NCF / Comprobante del proveedor</label>
          <input type="text" id="cpNcf" placeholder="Opcional">
          <label>Fecha</label>
          <input type="date" id="cpFecha">
          <label>Fecha de vencimiento</label>
          <input type="date" id="cpVencimiento">
          <label>Monto</label>
          <input type="number" step="0.01" id="cpMonto" placeholder="0.00">
          <button type="button" id="btnGuardarCuenta">Guardar Cuenta por Pagar</button>
          <p id="mensajeCuenta"></p>
        </div>
      </div>

      <div class="cp-col-der">
        <div class="cp-card">
          <h3>Cuentas por Pagar</h3>
          <input type="text" id="buscadorCuentas" placeholder="🔍 Buscar por proveedor...">
          <table id="tablaCuentas">
            <thead>
              <tr>
                <th>Proveedor</th>
                <th>NCF</th>
                <th>Vence</th>
                <th>Monto</th>
                <th>Pagado</th>
                <th>Saldo</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cuerpoCuentas"></tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <!-- Registrar Pago a Proveedor -->
  <div class="cp-overlay" id="overlayPago" style="display:none;">
    <div class="cp-modal">
      <div class="cp-modal-header">
        <h3>💵 Registrar Pago</h3>
        <button type="button" id="btnCerrarPago" class="btn-cerrar-x">✕</button>
      </div>

      <div class="cp-detalle-card">
        <p><strong>Proveedor:</strong> <span id="pgProveedor"></span></p>
        <p><strong>NCF:</strong> <span id="pgNcf"></span></p>
        <p><strong>Monto total:</strong> <span id="pgMontoTotal"></span></p>
        <p><strong>Pagado:</strong> <span id="pgPagado"></span></p>
        <p class="cp-saldo-linea"><strong>Saldo pendiente:</strong> <span id="pgSaldo"></span></p>
      </div>

      <label>Monto a pagar</label>
      <input type="number" step="0.01" id="pgMonto" placeholder="0.00">

      <label>Forma de pago</label>
      <select id="pgFormaPago">
        <option>Efectivo</option>
        <option>Tarjeta Crédito</option>
        <option>Tarjeta Débito</option>
        <option>Transferencia</option>
        <option>Cheque</option>
      </select>

      <p id="pgMensaje"></p>

      <button type="button" id="btnConfirmarPago">✔ Registrar Pago</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="permisos.js"></script>
  <script src="cuentaspagar.js"></script>
</body>
</html>
