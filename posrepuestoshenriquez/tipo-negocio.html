<div class="tn-card">
  <h3>Tipo de Negocio</h3>
  <p class="tn-nota">
    Esto cambia las etiquetas del módulo de Inventario (Marca, Modelo, etc.)
    para que se ajusten a tu tipo de negocio. No borra ni mueve ningún dato.
  </p>
  <select id="tipoNegocioSelect">
    <option value="repuestos_vehiculos">Repuestos de vehículos</option>
    <option value="repuestos_motos">Repuestos de motocicletas</option>
    <option value="farmacia">Farmacia</option>
    <option value="supermercado">Supermercado / Colmado</option>
    <option value="generico">Genérico (otro tipo de negocio)</option>
  </select>
  <button id="btnGuardarTipoNegocio">Guardar Tipo de Negocio</button>
  <p id="tnMensaje"></p>
</div>
